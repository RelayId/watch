name: Wear OS CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: wear-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  gradle-version: '8.13'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4
              with:
                  packages: platform-tools

            - name: Install Android build tools
              shell: bash
              run: |
                  set -euo pipefail
                  sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

            - name: Verify source tree
              shell: bash
              run: |
                  set -euo pipefail
                  test -f wear/src/main/AndroidManifest.xml
                  test -f wear/src/main/res/drawable-nodpi/relayid.png
                  ! find . -type f \( -name '*.jks' -o -name '*.keystore' \) -print -quit | grep -q .
                  version_code="${RELAYID_ANDROID_VERSION_CODE:-2}"
                  test -n "$version_code"
                  test "$version_code" -ge 1 -a "$version_code" -le 2100000000
                  test $((version_code % 2)) -eq 0
                  git diff --check

    wear-prerelease:
        needs: check
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            actions: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  gradle-version: '8.13'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4
              with:
                  packages: platform-tools

            - name: Install Android build tools
              shell: bash
              run: |
                  set -euo pipefail
                  sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

            - name: Configure release signing
              if: github.event_name != 'pull_request'
              shell: bash
              env:
                  KEYSTORE_BASE64: ${{ secrets.RELAYID_ANDROID_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.RELAYID_ANDROID_KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.RELAYID_ANDROID_KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.RELAYID_ANDROID_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  test -n "$KEYSTORE_BASE64" -a -n "$KEYSTORE_PASSWORD" -a -n "$KEY_ALIAS" -a -n "$KEY_PASSWORD"
                  mkdir -p .secrets
                  printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .secrets/relayid-watch.keystore
                  {
                      echo "RELAYID_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/.secrets/relayid-watch.keystore"
                      echo "RELAYID_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
                      echo "RELAYID_ANDROID_KEY_ALIAS=$KEY_ALIAS"
                      echo "RELAYID_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
                      echo "RELAYID_REQUIRE_SIGNING=true"
                  } >> "$GITHUB_ENV"

            - name: Allocate Wear version code
              if: github.event_name != 'pull_request'
              shell: bash
              run: |
                  set -euo pipefail
                  current='${{ vars.RELAYID_VERSION_CODE }}'
                  if [[ "$current" =~ ^[0-9]+$ ]]; then
                      baseline="$((current + 2))"
                  else
                      baseline=2
                  fi
                  run_version="$((GITHUB_RUN_NUMBER * 2))"
                  if (( run_version > baseline )); then
                      next="$run_version"
                  else
                      next="$baseline"
                  fi
                  echo "RELAYID_ANDROID_VERSION_CODE=$next" >> "$GITHUB_ENV"

            - name: Build release APK and AAB
              run: gradle :wear:assembleRelease :wear:bundleRelease --no-daemon --stacktrace
              env:
                  RELAYID_REQUIRE_SIGNING: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
                  CXXFLAGS: -Wno-deprecated-declarations -Wno-overloaded-virtual

            - name: Name release APK and AAB
              shell: bash
              run: |
                  set -euo pipefail
                  version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' wear/build.gradle.kts | head -n1)"
                  version_code="${RELAYID_ANDROID_VERSION_CODE:-2}"
                  base="relayid-wear-v${version_name}-${version_code}"
                  apk_path="$(find wear/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
                  test -n "$apk_path"
                  cp "$apk_path" relayid-wear.apk
                  aab_path="$(find wear/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
                  test -n "$aab_path"
                  cp "$aab_path" relayid-wear.aab
                  test -f wear/build/outputs/mapping/release/mapping.txt
                  if [ -f wear/build/outputs/native-debug-symbols/release/native-debug-symbols.zip ]; then
                      echo 'Native debug symbols were generated; the AAB will contain symbol metadata when available.'
                  else
                      echo 'No native symbol archive was produced because the bundled native dependency is already stripped.'
                  fi

            - name: Upload Wear APK and AAB artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: relayid-wear-release
                  path: |
                      relayid-wear.apk
                      relayid-wear.aab
                  if-no-files-found: warn

            - name: Publish rolling prerelease
              if: github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  if gh release view wear-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      gh release edit wear-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Latest RelayId Wear OS' --prerelease --latest
                  else
                      gh release create wear-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Latest RelayId Wear OS' --prerelease --latest
                  fi
                  while IFS= read -r asset; do
                      gh release delete-asset wear-latest "$asset" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
                  done < <(gh release view wear-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep '^relayid-wear' || true)
                  assets=(relayid-wear.apk relayid-wear.aab)
                  gh release upload wear-latest "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

            - name: Publish update manifest metadata
              if: github.event_name != 'pull_request' && env.MANIFEST_DISPATCH_TOKEN != ''
              env:
                  GH_TOKEN: ${{ secrets.MANIFEST_DISPATCH_TOKEN }}
                  MANIFEST_DISPATCH_TOKEN: ${{ secrets.MANIFEST_DISPATCH_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' wear/build.gradle.kts | head -n1)"
                  version_code="${RELAYID_ANDROID_VERSION_CODE:-2}"
                  digest="$(sha256sum relayid-wear.apk | cut -d ' ' -f1)"
                  aab_digest="$(sha256sum relayid-wear.aab | cut -d ' ' -f1)"
                  jq -n \
                    --arg package 'com.relayid.app' \
                    --arg versionName "$version_name" \
                    --argjson versionCode "$version_code" \
                    --arg downloadUrl 'https://relayid.github.io/manifest/wear/' \
                    --arg artifactUrl 'https://github.com/RelayId/watch/releases/download/wear-latest/relayid-wear.apk' \
                    --arg sha256 "$digest" \
                    --arg aabUrl 'https://github.com/RelayId/watch/releases/download/wear-latest/relayid-wear.aab' \
                    --arg aabSha256 "$aab_digest" \
                    '{event_type:"publish-wear",client_payload:{package:$package,versionName:$versionName,versionCode:$versionCode,downloadUrl:$downloadUrl,artifactUrl:$artifactUrl,sha256:$sha256,artifacts:[{format:"apk",artifactUrl:$artifactUrl,sha256:$sha256},{format:"aab",artifactUrl:$aabUrl,sha256:$aabSha256}]}}' |
                    gh api repos/RelayId/manifest/dispatches --input -
